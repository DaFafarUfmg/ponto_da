<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quem está na sala do DA</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:#f6f7f9; color:#202124; }
  header { background:#fff; border-bottom:1px solid #dadce0; padding:18px; text-align:center; font-weight:700; font-size:1.2rem; }
  main { max-width:1000px; margin:0 auto; padding:28px 16px 40px; text-align:center; }
  #contador { font-size:1.2rem; color:#5f6368; margin-bottom:22px; }
  #contador strong { color:#1e8e3e; font-size:2.4rem; }
  #lista { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:12px; }
  .pessoa { background:#fff; border:1px solid #dadce0; border-left:8px solid #1e8e3e; border-radius:12px; padding:18px 14px; font-size:1.2rem; text-align:left; }
  #vazio { font-size:1.4rem; color:#5f6368; margin-top:40px; }
  #rodape { margin-top:30px; font-size:.9rem; color:#80868b; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>Quem está na sala do DA</header>
<main>
  <div id="contador"></div>
  <div id="lista"></div>
  <div id="vazio" hidden>Ninguém na sala no momento.</div>
  <div id="rodape">Carregando...</div>
</main>

<script>
  // Cole aqui a mesma URL do Apps Script usada no index.html (termina em /exec)
  const API_URL = 'https://script.google.com/macros/s/AKfycbxKLK-r19FXqw0RC0A1DB0qCk0eXyBXRGA9StEyQ1ieFyAK1aOSzxbsdBmeYj4qg4oBpw/exec';
  const INTERVALO_SEGUNDOS = 30;

  const $ = function (id) { return document.getElementById(id); };

  async function atualizar() {
    if (API_URL.indexOf('COLE_AQUI') !== -1) {
      $('rodape').textContent = 'Falta configurar a URL do Apps Script no arquivo painel.html.';
      return;
    }
    try {
      const resp = await fetch(API_URL + '?' + new URLSearchParams({ acao: 'painel' }));
      const r = await resp.json();
      if (!r.ok) throw new Error(r.erro);

      const lista = $('lista');
      lista.innerHTML = '';
      r.naSala.forEach(function (nome) {
        const d = document.createElement('div');
        d.className = 'pessoa';
        d.textContent = nome;
        lista.appendChild(d);
      });

      const n = r.naSala.length;
      $('contador').innerHTML = '<strong>' + n + '</strong> ' + (n === 1 ? 'pessoa na sala' : 'pessoas na sala');
      $('vazio').hidden = n > 0;
      $('rodape').textContent = 'Atualizado às ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    } catch (e) {
      $('rodape').textContent = 'Sem conexão com o sistema. Tentando de novo...';
    }
  }

  atualizar();
  setInterval(atualizar, INTERVALO_SEGUNDOS * 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) atualizar(); });
</script>
</body>
</html>
